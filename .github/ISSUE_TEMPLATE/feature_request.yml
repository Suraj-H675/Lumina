name: Feature request
description: Propose a phase-aligned, scientifically grounded Lumina outcome.
title: "feature: "
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Requests should explain the user problem, scientific/data basis, accessibility implications,
        privacy/security impact, and operational cost. Existing architecture and past roadmap
        decisions are context rather than immutable constraints.
  - type: textarea
    id: outcome
    attributes:
      label: User outcome
      description: Describe what a user should be able to accomplish and why it matters.
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Product area or prerequisite
      description: Identify the affected product area and any concrete prerequisite when known.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Scientific and data basis
      description: Identify deterministic calculations, curated content, official data, provenance, licences, and uncertainty needs.
    validations:
      required: true
  - type: textarea
    id: degraded
    attributes:
      label: Accessibility and degraded behavior
      description: Cover keyboard, screen reader, reduced motion, high contrast, 2D/text fallback, offline, and provider-failure behavior.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy, security, and cost
      description: Explain data collection, location/upload handling, external services, free-core constraints, and resource limits.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and scope boundaries
      description: Note simpler outcomes, explicitly deferred work, and why existing features are insufficient.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I identified any new paid dependency, external service, account requirement, or recurring infrastructure cost.
          required: true
        - label: I considered an accessible non-pointer/non-animation/non-3D path for any core interaction this changes.
          required: true
