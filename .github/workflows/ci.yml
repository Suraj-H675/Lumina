name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.17.0"
          run_install: false
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          check-latest: false
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Verify Node and pnpm versions
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(pnpm --version)" = "11.17.0"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          python-version: "3.12.13"
          download-from-astral-mirror: false
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "uv-0.12.18"
          cache-python: false

      - name: Verify uv version
        run: |
          uv --version |
            awk 'NR == 1 && $1 == "uv" && $2 == "0.12.18" { ok=1 } END { exit !(NR == 1 && ok) }'

      - name: Restore exact dependencies
        run: |
          uv lock --check
          uv sync --locked
          pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

      - name: Assert API-client check cleanup
        run: |
          test -z "$(
            find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -type d \
              \( -name 'nova-lumina-api-client-first-*' -o -name 'nova-lumina-api-client-second-*' \) \
              -print -quit
          )"

      - name: Assert clean repository
        run: |
          git diff --exit-code
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"

  python_postgres:
    name: Python and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.17.0"
          run_install: false
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          check-latest: false

      - name: Verify Node and pnpm versions
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(pnpm --version)" = "11.17.0"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.18"
          python-version: "3.12.13"
          download-from-astral-mirror: false
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          cache-suffix: "uv-0.12.18"
          cache-python: false

      - name: Verify uv version
        run: |
          uv --version |
            awk 'NR == 1 && $1 == "uv" && $2 == "0.12.18" { ok=1 } END { exit !(NR == 1 && ok) }'

      - name: Restore exact Python dependencies
        run: |
          uv lock --check
          uv sync --locked
          pnpm install --frozen-lockfile

      - name: Create isolated CI environment
        run: |
          test ! -e .env
          test -z "$(
            docker volume ls --quiet \
              --filter name='^lumina_lumina_postgres_data$'
          )"
          uv run python scripts/bootstrap/create_local_env.py --ephemeral-candidate
          test -f .env
          test "$(stat -c '%a' .env)" = 600
          candidate_project="$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env)"
          candidate_volume="$(sed -n 's/^COMPOSE_POSTGRES_VOLUME_NAME=//p' .env)"
          [[ "$candidate_project" =~ ^lumina_public_candidate_[0-9a-f]{16}$ ]]
          test "$candidate_volume" = "${candidate_project}_postgres_data"
          test "$candidate_volume" != lumina_lumina_postgres_data

      - name: Run Python and PostgreSQL acceptance
        run: |
          candidate_project="$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env)"
          candidate_volume="$(sed -n 's/^COMPOSE_POSTGRES_VOLUME_NAME=//p' .env)"
          [[ "$candidate_project" =~ ^lumina_public_candidate_[0-9a-f]{16}$ ]]
          test "$candidate_volume" = "${candidate_project}_postgres_data"
          test "$candidate_volume" != lumina_lumina_postgres_data
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy \
            apps/api/src \
            apps/api/tests \
            scripts/bootstrap \
            scripts/data \
            scripts/openapi \
            scripts/ci
          bash -n scripts/ci/check_security.sh
          docker compose --env-file .env -p "$candidate_project" up -d --wait db
          # pg_trgm is owner-provisioned between the accepted B2 and B3 revisions.
          # Replay the historical lineage to exactly B2 without the extension,
          # install pg_trgm 1.6 in public as the database owner, then upgrade to
          # head so the B3 migration verifies the exact tuple and the reviewed
          # astrometry vocabulary is present.
          uv run alembic upgrade b7f3a2c81d4e
          test "$(
            docker compose --env-file .env -p "$candidate_project" exec -T db \
              psql -U lumina_admin -d lumina -Atqc \
              "SELECT count(*) FROM pg_extension WHERE extname = 'pg_trgm'"
          )" = "0"
          test "$(
            docker compose --env-file .env -p "$candidate_project" exec -T db \
              psql -U lumina_admin -d lumina -Atqc \
              'SELECT version_num FROM alembic_version'
          )" = "b7f3a2c81d4e"
          docker compose --env-file .env -p "$candidate_project" exec -T db \
            psql -U lumina_admin -d lumina -c \
            "CREATE EXTENSION pg_trgm VERSION '1.6' SCHEMA public"
          uv run alembic upgrade head
          uv run nova-lumina-catalog ingest --slice gaia-dr3-exoplanet-host-photometry-v1
          uv run nova-lumina-catalog ingest --slice gaia-dr3-exoplanet-host-photometry-v1
          uv run nova-lumina-catalog data-check --slice gaia-dr3-exoplanet-host-photometry-v1
          uv run nova-lumina-catalog ingest --slice gaia-dr3-exoplanet-host-astrometry-v1
          uv run nova-lumina-catalog ingest --slice gaia-dr3-exoplanet-host-astrometry-v1
          uv run nova-lumina-catalog data-check --slice gaia-dr3-exoplanet-host-astrometry-v1
          LUMINA_ENV=test uv run pytest -q
          test "$(uv run alembic heads)" = "a2b3c4d5e6f7 (head)"
          test "$(
            docker compose --env-file .env -p "$candidate_project" exec -T db \
              psql -U lumina_admin -d lumina -Atqc \
              'SELECT version_num FROM alembic_version'
          )" = "a2b3c4d5e6f7"
          test "$(
            docker compose --env-file .env -p "$candidate_project" exec -T db \
              psql -U lumina_admin -d lumina_test -Atqc \
              'SELECT version_num FROM alembic_version'
          )" = "a2b3c4d5e6f7"
          uv run python scripts/ci/check_migration_integrity.py

      - name: Remove PostgreSQL and generated environment
        if: always()
        run: |
          cleanup_status=0
          if ! test -f .env; then
            test -z "$(
              docker volume ls --quiet \
                --filter name='^lumina_lumina_postgres_data$'
            )"
            exit 0
          fi
          candidate_project="$(sed -n 's/^COMPOSE_PROJECT_NAME=//p' .env)"
          candidate_volume="$(sed -n 's/^COMPOSE_POSTGRES_VOLUME_NAME=//p' .env)"
          if [[ ! "$candidate_project" =~ ^lumina_public_candidate_[0-9a-f]{16}$ ]]; then
            echo "Invalid isolated Compose project metadata; refusing teardown." >&2
            exit 1
          fi
          if test "$candidate_volume" != "${candidate_project}_postgres_data" || \
            test "$candidate_volume" = lumina_lumina_postgres_data; then
            echo "Invalid isolated Compose volume metadata; refusing teardown." >&2
            exit 1
          fi
          docker compose --env-file .env -p "$candidate_project" \
            down -v --remove-orphans || cleanup_status=$?
          candidate_containers="$(
            docker compose --env-file .env -p "$candidate_project" ps -aq
          )" || cleanup_status=$?
          candidate_volumes="$(
            docker volume ls --quiet --filter "name=^${candidate_volume}$"
          )" || cleanup_status=$?
          test -z "$candidate_containers" || cleanup_status=$?
          test -z "$candidate_volumes" || cleanup_status=$?
          test -z "$(
            docker volume ls --quiet \
              --filter name='^lumina_lumina_postgres_data$'
          )" || cleanup_status=$?
          if test "$cleanup_status" -eq 0; then
            unlink -- .env || cleanup_status=$?
          fi
          if test "$cleanup_status" -eq 0; then
            test ! -e .env || cleanup_status=$?
          fi
          exit "$cleanup_status"

      - name: Assert clean repository
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"

  web_e2e:
    name: Web build and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Configure runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.17.0"
          run_install: false
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          check-latest: false
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Verify Node and pnpm versions
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(pnpm --version)" = "11.17.0"

      - name: Build and run Chromium E2E
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test "$(pnpm --filter @nova-lumina/web exec playwright --version)" = "Version 1.62.1"
          pnpm --filter @nova-lumina/web exec playwright install --with-deps chromium
          pnpm test:e2e

      - name: Assert web cleanup and ignored outputs
        if: always()
        run: |
          test -z "$(
            find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 \
              -name 'nova-lumina-status-e2e-*' -print -quit
          )"
          if pgrep -f \
            '[s]tatus-stub-harness\.mjs|[n]ext start|[l]umina.*worker' \
            >/dev/null; then
            echo "Nova-Lumina test process residue remains" >&2
            exit 1
          fi
          test -z "$(
            git ls-files -- \
              apps/web/next-env.d.ts \
              apps/web/.next \
              apps/web/playwright-report \
              apps/web/test-results
          )"
          test -z "$(
            git diff --cached --name-only -- \
              apps/web/next-env.d.ts \
              apps/web/.next \
              apps/web/playwright-report \
              apps/web/test-results
          )"
          for output in \
            apps/web/next-env.d.ts \
            apps/web/.next \
            apps/web/playwright-report \
            apps/web/test-results; do
            if test -e "$output"; then
              git check-ignore -q "$output"
            fi
          done

      - name: Assert clean repository
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"

      - name: Upload bounded E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  api_container:
    name: API container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build production API image
        run: |
          docker build \
            --file Dockerfile.vercel \
            --tag nova-lumina-api:ci \
            .

      - name: Smoke production API image
        run: |
          test "$(docker run --rm --entrypoint id nova-lumina-api:ci -u)" = "10001"
          test "$(docker run --rm --entrypoint /app/.venv/bin/python nova-lumina-api:ci --version)" = "Python 3.12.13"
          docker run --rm --entrypoint /app/.venv/bin/python nova-lumina-api:ci -c \
            'import ssl; context = ssl.create_default_context(); assert context.check_hostname; assert context.verify_mode == ssl.CERT_REQUIRED; assert context.get_ca_certs()'
          docker run --rm --entrypoint /bin/uv nova-lumina-api:ci --version |
            awk 'NR == 1 && $1 == "uv" && $2 == "0.12.17" { ok=1 } END { exit !(NR == 1 && ok) }'
          docker run --rm \
            --entrypoint /app/.venv/bin/nova-lumina-provider \
            nova-lumina-api:ci \
            --help >/dev/null
          artifact_output="$(
            docker run --rm \
              --entrypoint /app/.venv/bin/nova-lumina-catalog \
              nova-lumina-api:ci \
              ingest --slice simbad-messier-j2000-v2 --validate-only
          )"
          docker run --rm -i \
            --entrypoint /app/.venv/bin/python \
            nova-lumina-api:ci \
            - "$artifact_output" <<'PY'
          import json
          import sys
          from lumina.sky_context.domain.bright_star_artifact import (
              BRIGHT_STAR_ROW_COUNT,
              validate_bright_star_artifact,
          )
          from lumina.sky_context.domain.iau_context_artifact import (
              CONSTELLATION_ROW_COUNT,
              NAMED_ANCHOR_ROW_COUNT,
              validate_iau_context_artifacts,
          )

          payload = json.loads(sys.argv[1])
          assert payload == {
              "artifact_sha256": "7d155edba33d1fc89b036da458de8dc40d387a5c898ef0c717f1463d49a38cdc",
              "duration_ms": payload["duration_ms"],
              "measurement_count": 220,
              "replayed_source_record_count": 0,
              "slice_id": "simbad-messier-j2000-v2",
              "source_record_count": 110,
              "status": "validated",
          }
          assert isinstance(payload["duration_ms"], int) and payload["duration_ms"] >= 0
          bright = validate_bright_star_artifact()
          named, constellations = validate_iau_context_artifacts()
          assert len(bright.rows) == BRIGHT_STAR_ROW_COUNT
          assert len(named.rows) == NAMED_ANCHOR_ROW_COUNT
          assert len(constellations.constellations) == CONSTELLATION_ROW_COUNT
          PY

      - name: Assert clean repository
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"

  security:
    name: Dependency and secret security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Configure runner temporary directory
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: "11.17.0"
          run_install: false
          cache: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          check-latest: false
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Verify Node and pnpm versions
        run: |
          test "$(node --version)" = "v24.16.0"
          test "$(pnpm --version)" = "11.17.0"

      - name: Restore exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run mandatory security scanners
        run: pnpm security:check

      - name: Assert scanner cleanup
        if: always()
        run: |
          test -z "$(
            find "${RUNNER_TEMP:-/tmp}" -maxdepth 1 -type d \
              -name 'nova-lumina-security-*' -print -quit
          )"

      - name: Assert clean repository
        if: always()
        run: |
          git diff --exit-code
          git diff --cached --quiet
          test -z "$(git ls-files --others --exclude-standard)"

  acceptance:
    name: Acceptance
    if: always()
    needs: [repository, python_postgres, web_e2e, api_container, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every acceptance job
        run: |
          test '${{ needs.repository.result }}' = 'success'
          test '${{ needs.python_postgres.result }}' = 'success'
          test '${{ needs.web_e2e.result }}' = 'success'
          test '${{ needs.api_container.result }}' = 'success'
          test '${{ needs.security.result }}' = 'success'
