[project]
name = "lumina-api"
version = "0.0.0"
description = "Lumina backend package foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.140.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "uvicorn==0.51.0",
]

[project.scripts]
lumina-api = "lumina.main:run"

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumina"]
