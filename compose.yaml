name: lumina

services:
  db:
    image: postgres:18.4@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_USER: lumina_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
      POSTGRES_TEST_RUNTIME_PASSWORD: ${POSTGRES_TEST_RUNTIME_PASSWORD:?POSTGRES_TEST_RUNTIME_PASSWORD is required}
      POSTGRES_TEST_MIGRATION_PASSWORD: ${POSTGRES_TEST_MIGRATION_PASSWORD:?POSTGRES_TEST_MIGRATION_PASSWORD is required}
    ports:
      - target: 5432
        published: ${POSTGRES_HOST_PORT:?POSTGRES_HOST_PORT is required}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - lumina_postgres_data:/var/lib/postgresql
      - ./infra/docker/postgres/010-ensure-lumina-databases.sh:/docker-entrypoint-initdb.d/010-ensure-lumina-databases.sh:ro
      - ./infra/docker/postgres/healthcheck.sh:/usr/local/bin/lumina-postgres-healthcheck:ro
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/lumina-postgres-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  lumina_postgres_data:
    name: ${COMPOSE_POSTGRES_VOLUME_NAME:-lumina_lumina_postgres_data}
