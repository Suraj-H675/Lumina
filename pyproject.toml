[project]
name = "lumina-workspace"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["lumina-api"]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[tool.uv]
package = false
required-version = ">=0.11.0"

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
lumina-api = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["apps/api/src", "apps/api/tests"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["apps/api/tests"]
